<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéCast: Multi-Verse Weatherdex</title>
    
    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#DC0A2D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png" type="image/png">

    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pokemon"> <!-- Default Theme -->

    <!-- Theme Selector Dropdown Bar -->
    <div class="theme-selector-bar">
        <label for="theme-select">UNIVERSE:</label>
        <select id="theme-select">
            <option value="pokemon">🔴 PokéCast (Pokémon)</option>
            <option value="dbz">🟠 Saiyan Cast (DBZ)</option>
            <option value="naruto">🍥 Hidden Leaf (Naruto)</option>
            <option value="doraemon">🔔 Future Gadget (Doraemon)</option>
        </select>
    </div>

    <div class="pokedex-container">
        <!-- Left Hinge -->
        <div class="pokedex-left">
            <div class="hinge-top"></div>
            <div class="hinge-bottom"></div>
            
            <!-- The Main Screen with CRT Scanlines Overlay -->
            <div class="screen-container">
                <div class="crt-overlay"></div>
                <div class="screen-header">
                    <span class="red-light blink"></span>
                    <span class="red-light"></span>
                </div>
                <div class="screen-content" id="weather-display">
                    <!-- Default state -->
                    <div class="intro-screen">
                        <div class="pokeball-icon">🔴</div>
                        <p>Enter a city to scan multi-verse weather data!</p>
                    </div>
                </div>
                <div class="screen-footer">
                    <div class="speaker-grill">
                        <div></div><div></div><div></div><div></div>
                    </div>
                </div>
            </div>

            <!-- Search Input & Button -->
            <div class="search-bar">
                <input type="text" id="city-input" placeholder="Enter City Name..." autocomplete="off">
                <button id="search-btn">Scan</button>
            </div>
        </div>

        <!-- Right Side -->
        <div class="pokedex-right">
            <div class="data-pads">
                <div class="pad"></div>
                <div class="pad"></div>
                <div class="pad"></div>
            </div>
             <div class="cross-pad">
                <div class="cross-h"></div>
                <div class="cross-v"></div>
            </div>
        </div>
    </div>

    <!-- Clean Non-Intrusive Footer -->
    <footer class="app-footer">
        <p>Built for multi-verse explorers by <strong>Ansh Raghav</strong> (Moradabad)</p>
        <p style="margin-top: 2px;">&copy; 2026 Mohitansh. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
